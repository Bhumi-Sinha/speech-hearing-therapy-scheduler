name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scheduler_user
          POSTGRES_PASSWORD: scheduler_pass
          POSTGRES_DB: scheduler_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: scheduler_user
          POSTGRES_PASSWORD: scheduler_pass
          POSTGRES_DB: scheduler_db_test
          JWT_SECRET_KEY: ci_test_secret_key
        run: pytest -v --cov=app --cov-report=term-missing

  frontend-build:
    name: Frontend - Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t scheduler-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t scheduler-frontend:ci ./frontend

  e2e-test:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create backend .env for compose
        run: |
          cat > backend/.env <<EOF
          POSTGRES_USER=scheduler_user
          POSTGRES_PASSWORD=scheduler_pass
          POSTGRES_DB=scheduler_db
          JWT_SECRET_KEY=ci_e2e_secret_key
          ENVIRONMENT=ci
          EOF

      - name: Start the full stack
        run: docker compose up -d --build

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/docs > /dev/null; then
              echo "Backend is up"; exit 0
            fi
            echo "Waiting for backend... ($i)"; sleep 3
          done
          echo "Backend never became healthy"; docker compose logs; exit 1

      - name: Wait for frontend to be healthy
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend is up"; exit 0
            fi
            echo "Waiting for frontend... ($i)"; sleep 3
          done
          echo "Frontend never became healthy"; docker compose logs; exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000
        run: npx playwright test --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
